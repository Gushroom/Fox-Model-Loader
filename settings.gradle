pluginManagement {
    repositories {
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://files.minecraftforge.net/maven/" }
        maven { url "https://maven.neoforged.net/releases" }
        gradlePluginPortal()
    }
}

rootProject.name = 'yes_steve_model'

include 'common'
if (settings.startParameter.projectProperties.get('skipFabric') != 'true') {
    include 'fabric'
}
include 'neoforge'
